site_name: plotviz
site_description: Publication-quality chart editor for scientists and analysts
site_author: Paulo Cachim
site_url: https://pcachim.github.io/plotviz/
repo_url: https://github.com/pcachim/plotviz
repo_name: pcachim/plotviz
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
exclude_docs: README.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Examples: examples.md
  - Data:
    - Datasets and Import: datasets.md
    - Generate: generate.md
    - Statistics: statistics.md
    - Transform: transform.md
  - Layout & Style:
    - Figure: layout-style.md
    - Subplots: subplots.md
    - Color Schemes: color-schemes.md
    - Color Palettes: palettes.md
  - Plots:
    - Plot: plot.md
    - Chart Types: chart-types.md
    - Curves and Fitting: curves.md
    - Axes: axes.md
    - Canvas & Grid: canvas-grid.md
    - Legend & Notes: legend-notes.md
  - Tools:
    - Seaborn Explorer: seaborn-explorer.md
    - Python Code Runner: code-runner.md
  - Export:
    - Export Image: export.md
    - Python Export Bundle: python-export.md
  - Reference:
    - File Formats: file-formats.md
    - Menus: menus.md
    - Keyboard Shortcuts: shortcuts.md
    - Troubleshooting: troubleshooting.md
    - Glossary: glossary.md
    - Licenses: licenses.md

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pcachim/plotviz
