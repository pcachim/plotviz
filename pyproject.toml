[project]
name = "plotviz"
# Version is defined in src/plotviz/config/_version.py — change it there.
dynamic = ["version"]
description = "Publication-Quality Chart Generator"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Paulo Cachim", email = "eurocodepy@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "seaborn>=0.13",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "PyQt6>=6.5",
    "openpyxl>=3.1",
    "platformdirs>=3.0",
]

[project.scripts]
plotviz = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth — bump __version__ in this file to release.
path = "src/plotviz/config/_version.py"

[tool.hatch.build.targets.wheel]
sources = ["src/plotviz"]
packages = ["ui", "data", "styling", "config", "core"]

[dependency-groups]
dev = [
    "pyinstaller>=6.3",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mike>=2.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]


[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Correctness only: syntax errors, unused imports, undefined names, placeholder-less f-strings.
select = ["E9", "F401", "F821", "F541"]

[tool.mypy]
# Fully typed, UI-free layer only (core/ never imports Qt or ui/). Run:  mypy
files = ["src/plotviz/core"]
mypy_path = "src/plotviz"
explicit_package_bases = true
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
