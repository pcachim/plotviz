name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: src
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # core/ is the Qt-free layer; its mypy settings live in pyproject.toml.
      - run: uvx --from mypy==2.4.0 mypy
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install Qt offscreen system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libdbus-1-3 libglib2.0-0 '^libxcb.*'
      - name: Install dependencies (from pyproject + uv.lock)
        run: uv sync --locked
      - name: Run tests
        env:
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -v
